<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ARTIFACT-HEAD-START -->
<title>Bourse ETF Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@400;500;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap">
<style>
/* ======================================================================
   Bourse ETF Terminal — trading-desk instrumentation.
   Dark-first: the bare :root block is the dark palette; the light palette
   is restated under prefers-color-scheme:light and [data-theme="light"].
   ====================================================================== */
:root{
  --ink:#0b0f14; --panel:#111820; --raised:#161f29; --row:#131b24;
  --line:#1e2a36; --line-2:#2b3a49;
  --text:#e4edf4; --text-2:#8698aa; --text-3:#5a6b7c;
  --accent:#d9a24b; --accent-2:#f0c27b; --accent-ink:#2a1e08;
  --up:#36b07f; --up-wash:rgba(54,176,127,.13);
  --down:#e0604d; --down-wash:rgba(224,96,77,.13);
  --us:#4c8dff; --tr:#e30a17;
  --ok:#3ecf8e; --ok-wash:rgba(62,207,142,.12);
  --warn:#e8b23a; --warn-wash:rgba(232,178,58,.13);
  --bad:#f0604d; --bad-wash:rgba(240,96,77,.13);
  --idle:#64768a; --idle-wash:rgba(100,118,138,.12);
  /* Three voices, by what each page is for. The ETF workspace keeps the
     Didone (--disp/--mono above). The general dashboard speaks DM Sans.
     The System page is a machine readout, so it speaks Bitcount Ink. */
  --ui:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sys:"Bitcount Ink",monospace;
  --grid:rgba(255,255,255,.045);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.9);
  /* One typeface throughout. Playfair Display is a Didone: high stroke
     contrast and proportional figures by default, so every numeric run is
     pinned to tabular-nums below or price columns would not align. */
  --mono:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Playfair Display",Georgia,"Times New Roman",serif;
  --disp:"Playfair Display",Georgia,"Times New Roman",serif;
  --r:3px; --r-lg:5px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ok:#0f9d62; --ok-wash:rgba(15,157,98,.1);
    --warn:#a9771a; --warn-wash:rgba(169,119,26,.12);
    --bad:#cf4430; --bad-wash:rgba(207,68,48,.1);
    --idle:#7b8b9c; --idle-wash:rgba(123,139,156,.1);
    --ink:#eef1f5; --panel:#ffffff; --raised:#f6f8fa; --row:#fbfcfd;
    --line:#dde4ec; --line-2:#c6d2de;
    --text:#0d1620; --text-2:#5a6b7c; --text-3:#8698aa;
    --accent:#9a6b16; --accent-2:#b9832a; --accent-ink:#fff8ea;
    --up:#0f7d58; --down:#c13c27;
    --up-wash:rgba(15,125,88,.11); --down-wash:rgba(193,60,39,.11);
    --us:#2563d6; --tr:#c80812;
    --grid:rgba(13,22,32,.06);
    --shadow:0 1px 2px rgba(13,22,32,.07), 0 12px 28px -20px rgba(13,22,32,.35);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ok:#0f9d62; --ok-wash:rgba(15,157,98,.1);
  --warn:#a9771a; --warn-wash:rgba(169,119,26,.12);
  --bad:#cf4430; --bad-wash:rgba(207,68,48,.1);
  --idle:#7b8b9c; --idle-wash:rgba(123,139,156,.1);
  --ink:#eef1f5; --panel:#ffffff; --raised:#f6f8fa; --row:#fbfcfd;
  --line:#dde4ec; --line-2:#c6d2de;
  --text:#0d1620; --text-2:#5a6b7c; --text-3:#8698aa;
  --accent:#9a6b16; --accent-2:#b9832a; --accent-ink:#fff8ea;
  --up:#0f7d58; --down:#c13c27;
  --up-wash:rgba(15,125,88,.11); --down-wash:rgba(193,60,39,.11);
  --us:#2563d6; --tr:#c80812;
  --grid:rgba(13,22,32,.06);
  --shadow:0 1px 2px rgba(13,22,32,.07), 0 12px 28px -20px rgba(13,22,32,.35);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--ink); color:var(--text);
  font:400 15px/1.55 var(--sans);
  font-variant-numeric:lining-nums;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums lining-nums lining-nums;letter-spacing:0}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--text-2)}
.eyebrow{
  font:600 10px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-3);
}

/* ---------------------------------------------------------------- top rail */
.rail{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:0 16px; min-height:54px;
  background:var(--panel); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:40;
}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:4px}
.brand-mark{
  width:22px;height:22px;flex:none;align-self:center;border-radius:2px;
  background:linear-gradient(145deg,var(--accent-2),var(--accent));
  position:relative;
}
.brand-mark::after{
  content:"";position:absolute;inset:5px 5px auto 5px;height:2px;
  background:var(--accent-ink);box-shadow:0 5px 0 var(--accent-ink),0 10px 0 var(--accent-ink);
  opacity:.75;
}
.brand-name{font:700 19px/1 var(--disp);letter-spacing:0}
.brand-sub{
  font:600 9.5px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;
  color:var(--text-3);
}
.clocks{display:flex;gap:6px}
.clock{
  display:flex;align-items:center;gap:7px;
  padding:5px 9px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--raised);
}
.clock-city{font:600 9.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.clock-time{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums lining-nums}
.sess{
  width:6px;height:6px;border-radius:50%;background:var(--text-3);flex:none;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--text-3) 22%,transparent);
}
.sess[data-open="1"]{background:var(--up);box-shadow:0 0 0 2px var(--up-wash)}
.rail-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.asof{text-align:right;line-height:1.25}
.asof b{display:block;font:500 11.5px/1.3 var(--mono);color:var(--text-2)}
.icon-btn{
  width:30px;height:30px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:var(--r);background:var(--raised);
  color:var(--text-2);transition:color .12s,border-color .12s;
}
.icon-btn:hover{color:var(--text);border-color:var(--line-2)}

/* ------------------------------------------------------------------- shell */
.shell{
  display:grid; grid-template-columns:minmax(300px,340px) minmax(0,1fr);
  gap:1px; background:var(--line); align-items:start;
}
.pane{background:var(--ink);min-width:0}

/* --------------------------------------------------------- instrument list */
.list-pane{
  display:flex;flex-direction:column;
  background:var(--panel);
  position:sticky; top:54px; max-height:calc(100dvh - 54px);
}
.mtabs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);flex:none}
.mtab{
  display:flex;flex-direction:column;gap:3px;align-items:flex-start;
  padding:11px 12px 10px;background:var(--panel);
  border-bottom:2px solid transparent;transition:background .12s;
}
.mtab:hover{background:var(--raised)}
.mtab-code{
  display:inline-flex;align-items:center;gap:6px;
  font:700 14px/1 var(--disp);letter-spacing:.01em;
}
.mtab-code::before{content:"";width:3px;height:11px;border-radius:1px;background:var(--text-3)}
.mtab[data-market="US"] .mtab-code::before{background:var(--us)}
.mtab[data-market="TR"] .mtab-code::before{background:var(--tr)}
.mtab-label{font-size:11px;color:var(--text-3);letter-spacing:.01em}
.mtab[aria-selected="true"]{background:var(--raised);border-bottom-color:var(--accent)}
.mtab[aria-selected="true"] .mtab-label{color:var(--text-2)}

.list-tools{display:flex;gap:6px;padding:9px 10px;border-bottom:1px solid var(--line);flex:none}
.search,.sel{
  min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--ink);font-size:12.5px;
}
.search{flex:1 1 auto}
.search::placeholder{color:var(--text-3)}
.sel{flex:0 0 auto;max-width:42%;color:var(--text-2)}

.lhead{
  display:grid;grid-template-columns:1fr 74px 62px 46px;gap:8px;align-items:center;
  padding:7px 10px;border-bottom:1px solid var(--line);flex:none;
  background:var(--panel);
}
.lhead button{display:block;width:100%;text-align:right;color:var(--text-3)}
.lhead button:first-child{text-align:left}
.lhead button[aria-sort]{color:var(--accent)}
.list{overflow-y:auto;flex:1 1 auto;scrollbar-width:thin}
.row{
  display:grid;grid-template-columns:1fr 74px 62px 46px;gap:8px;align-items:center;
  width:100%;padding:8px 10px;text-align:left;
  border-bottom:1px solid var(--line);border-left:2px solid transparent;
  background:var(--row);transition:background .1s;
}
.row:hover{background:var(--raised)}
.row[aria-current="true"]{background:var(--raised);border-left-color:var(--accent)}
.row-id{min-width:0}
.row-tic{font:600 14px/1.25 var(--mono);letter-spacing:.01em}
.row-nm{
  font-size:10.5px;color:var(--text-3);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row-last{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums lining-nums;text-align:right}
.row-chg{
  font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums lining-nums;
  text-align:right;padding:2px 4px;border-radius:2px;
}
.row-chg[data-s="u"]{background:var(--up-wash);color:var(--up)}
.row-chg[data-s="d"]{background:var(--down-wash);color:var(--down)}
.row-spark{width:46px;height:20px;display:block}
.theme-bar{
  display:none;padding:8px 10px;border-bottom:1px solid var(--line);
  background:var(--raised);flex:none;
}
.theme-bar[data-on="1"]{display:block}
.theme-bar-name{font:600 11.5px/1.3 var(--sans);margin-bottom:5px}
.theme-bar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tb{min-width:0}
.tb-k{font:600 8.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.tb-v{margin-top:3px;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums lining-nums}
.list-foot{
  padding:8px 10px;border-top:1px solid var(--line);flex:none;
  font-size:10.5px;color:var(--text-3);line-height:1.45;
}

/* --------------------------------------------------------------- workspace */
.ws{display:flex;flex-direction:column;min-width:0}
.ihead{
  display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;
  padding:16px 20px 14px;border-bottom:1px solid var(--line);background:var(--panel);
}
.ident{min-width:0;flex:1 1 320px}
.ident-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:3px}
.ticker{font:700 28px/1.05 var(--disp);letter-spacing:0}
.chip{
  font:600 9.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;
  padding:4px 6px;border-radius:2px;border:1px solid var(--line-2);color:var(--text-2);
}
.chip-mkt{border-color:transparent;color:var(--accent-ink)}
.chip-mkt[data-m="US"]{background:var(--us);color:#fff}
.chip-mkt[data-m="TR"]{background:var(--tr);color:#fff}
.ident-nm{font-size:13.5px;color:var(--text);line-height:1.35;margin-bottom:3px}
.ident-meta{font-size:11px;color:var(--text-3)}
.ident-meta span+span::before{content:"·";margin:0 6px;color:var(--line-2)}
.quote{text-align:right;flex:0 0 auto}
.q-last{font:600 34px/1 var(--mono);font-variant-numeric:tabular-nums lining-nums;letter-spacing:0}
.q-cur{font:500 13px/1 var(--mono);color:var(--text-3);margin-right:4px}
.q-chg{display:flex;gap:8px;justify-content:flex-end;margin-top:5px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums lining-nums}
.q-sub{margin-top:6px;font-size:10.5px;color:var(--text-3)}

/* ---------------------------------------------------------------- controls */
.ctl{
  display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;
  padding:11px 20px;border-bottom:1px solid var(--line);background:var(--panel);
}
.ctl-grp{display:flex;flex-direction:column;gap:5px;min-width:0}
.ctl-grp>.eyebrow{display:flex;align-items:center;gap:6px}
.segs{display:flex;flex-wrap:wrap;gap:3px}
.seg{
  padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--raised);font:500 11.5px/1 var(--mono);color:var(--text-2);
  transition:color .1s,border-color .1s,background .1s;
}
.seg:hover{color:var(--text);border-color:var(--line-2)}
.seg[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;
}
.seg[disabled]{opacity:.32;cursor:not-allowed}
.seg-div{width:1px;align-self:stretch;background:var(--line);margin:0 3px}
.dates{display:flex;align-items:center;gap:5px}
.dates input{
  padding:5px 7px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--ink);font-family:var(--mono);font-size:11.5px;color-scheme:inherit;
}
.dates span{color:var(--text-3);font-size:11px}

/* ------------------------------------------------------------------- chart */
.chart-shell{position:relative;background:var(--ink);border-bottom:1px solid var(--line)}
.chart{height:clamp(300px,48vh,520px);width:100%}
.legend{
  position:absolute;top:10px;left:14px;z-index:5;pointer-events:none;
  display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;
  font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums lining-nums;
  background:color-mix(in srgb,var(--panel) 86%,transparent);
  border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;
  max-width:calc(100% - 28px);
}
.legend b{font-weight:600;color:var(--text-3);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
.legend .lg-t{color:var(--text-2)}
.chart-note{
  display:flex;gap:9px;align-items:flex-start;
  padding:8px 20px;border-bottom:1px solid var(--line);
  background:var(--down-wash);font-size:11.5px;color:var(--text);line-height:1.45;
}
.chart-note::before{content:"!";font:700 10px/14px var(--mono);flex:none;width:14px;height:14px;text-align:center;border-radius:50%;background:var(--down);color:#fff;margin-top:1px}
.chart-note[hidden]{display:none}

/* ------------------------------------------------------------------- stats */
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
  gap:1px;background:var(--line);border-bottom:1px solid var(--line);
}
.stat{background:var(--panel);padding:9px 12px 10px;min-width:0}
.stat-k{font:600 9.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.stat-v{
  margin-top:5px;font-family:var(--mono);font-size:14px;font-weight:500;
  font-variant-numeric:tabular-nums lining-nums;overflow:hidden;text-overflow:ellipsis;
}
.stat-s{margin-top:2px;font-size:10px;color:var(--text-3);font-family:var(--mono)}

/* ------------------------------------------------------------------ export */
.export{padding:16px 20px 22px;background:var(--panel)}
.export-top{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.export h2{font:600 17px/1.2 var(--disp);letter-spacing:0;margin:0}
.export p{margin:0;font-size:11.5px;color:var(--text-3);max-width:62ch;line-height:1.5}
.export-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin-bottom:12px;
}
.ex-cell{background:var(--raised);padding:8px 11px}
.ex-k{font:600 9.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.ex-v{margin-top:4px;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums lining-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 13px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--raised);font:500 12.5px/1 var(--sans);color:var(--text);
  transition:border-color .12s,background .12s;
}
.btn:hover{border-color:var(--text-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{flex:none}
.ex-msg{font-size:11.5px;color:var(--text-2);min-height:1.4em;line-height:1.4}
.ex-msg[data-s="err"]{color:var(--down)}
.ex-msg[data-s="ok"]{color:var(--up)}

/* ------------------------------------------------------------------ footer */
.foot{
  padding:14px 20px 26px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--text-3);line-height:1.6;background:var(--ink);
}
.foot code{font-family:var(--mono);color:var(--text-2)}
.foot a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}

/* ------------------------------------------------------- loading / failure */
.boot{padding:56px 20px;text-align:center;color:var(--text-2)}
.boot h1{font:600 16px/1.3 var(--disp);color:var(--text);margin:0 0 7px}
.boot p{margin:0 auto;max-width:56ch;font-size:12.5px;line-height:1.6}
.boot code{font-family:var(--mono);color:var(--accent)}
.spin{
  width:18px;height:18px;margin:0 auto 14px;border-radius:50%;
  border:2px solid var(--line-2);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:var(--raised);border-radius:2px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}

/* ======================================================================
   Shell navigation + the plain pages (Home, Portfolio, System).
   The ETF workspace above keeps its Didone trading-desk voice untouched;
   everything below speaks IBM Plex, because these pages are read and
   operated rather than scanned for price action.
   ====================================================================== */
.nav{display:flex;gap:2px;align-items:center;margin-left:4px}
.nav-btn{
  position:relative;padding:7px 12px 8px;border-radius:var(--r);
  font:500 12.5px/1 var(--ui);letter-spacing:.01em;color:var(--text-3);
  transition:color .13s,background .13s;white-space:nowrap;
}
.nav-btn:hover{color:var(--text);background:var(--raised)}
.nav-btn[aria-current="page"]{color:var(--text);font-weight:600}
.nav-btn[aria-current="page"]::after{
  content:"";position:absolute;left:11px;right:11px;bottom:-1px;height:2px;
  border-radius:1px;background:var(--accent);
}
.nav-badge{
  margin-left:6px;padding:1px 5px;border-radius:7px;background:var(--line);
  font:600 9.5px/1.5 var(--ui);color:var(--text-3);vertical-align:1px;
}

.page[hidden]{display:none!important}
.plain{font-family:var(--ui);padding:34px 26px 64px;max-width:1180px;margin:0 auto}
.plain ::selection{background:var(--accent);color:var(--accent-ink)}
.page-head{margin-bottom:26px}
.page-kicker{
  font:600 10px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px;
}
.page-title{
  font:600 30px/1.12 var(--ui);letter-spacing:-.025em;margin:0 0 8px;
  text-wrap:balance;
}
.page-lede{
  font:400 14.5px/1.6 var(--ui);color:var(--text-2);margin:0;max-width:66ch;
}

/* ------------------------------------------------------- empty placeholders */
.placeholder{
  margin-top:28px;border:1px dashed var(--line-2);border-radius:var(--r-lg);
  padding:52px 30px;text-align:center;background:var(--panel);
}
.placeholder-mark{
  width:40px;height:40px;margin:0 auto 16px;border-radius:9px;
  display:grid;place-items:center;background:var(--raised);
  border:1px solid var(--line);color:var(--text-3);
}
.placeholder h2{font:600 16px/1.3 var(--ui);margin:0 0 7px;color:var(--text)}
.placeholder p{font:400 13px/1.6 var(--ui);color:var(--text-3);margin:0 auto;max-width:48ch}
.planned{
  display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:20px;
}
.planned span{
  font:500 11px/1 var(--ui);color:var(--text-3);
  border:1px solid var(--line);border-radius:20px;padding:6px 11px;
}

/* ------------------------------------------------------------ system page */
/* ------------------------------------------------------------ system page
   Four status banners, one line each, so the whole operational picture and
   both actions fit a single screen without scrolling. Detail lives behind a
   per-banner disclosure rather than in four tall cards. */
.banners{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.bn{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);overflow:hidden}
.bn-head{
  display:grid;align-items:center;gap:14px;width:100%;text-align:left;
  grid-template-columns:28px minmax(150px,1.25fr) minmax(130px,1fr) auto 16px;
  padding:11px 14px;transition:background .12s;
}
.bn-head:hover{background:var(--raised)}
.bn-n{
  font:600 10px/1 var(--ui);color:var(--text-3);border:1px solid var(--line);
  border-radius:3px;padding:4px 0;text-align:center;letter-spacing:.04em;
}
.bn-id{min-width:0}
.bn-id b{display:block;font:500 13px/1.3 var(--ui);letter-spacing:.005em}
.bn-id small{
  display:block;font:400 11px/1.35 var(--ui);color:var(--text-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bn-read{min-width:0;display:flex;align-items:baseline;gap:8px}
.bn-read b{font:700 16px/1.2 var(--ui);letter-spacing:-.01em;white-space:nowrap}
.bn-read span{
  font:400 11px/1.35 var(--ui);color:var(--text-3);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bn-caret{
  color:var(--text-3);font:400 15px/1 var(--ui);transition:transform .16s;
  justify-self:end;
}
.bn[data-open="1"] .bn-caret{transform:rotate(90deg)}
.bn[data-open="1"]{border-color:var(--line-2)}
.bn-body{
  padding:0 14px 14px;display:flex;flex-direction:column;gap:11px;
  border-top:1px solid var(--line);margin-top:-1px;padding-top:13px;
}
.bn-body[hidden]{display:none}

/* the two actions, directly under the banners, each with its stamp above */
.ops{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(262px,1fr));gap:10px;
  margin-bottom:14px;
}
.ops-item{
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
  padding:11px 13px 12px;display:flex;flex-direction:column;gap:7px;
}
.ops-k{
  font:600 9.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-3);
}
.ops-v{
  font:500 12px/1.45 var(--ui);font-variant-numeric:tabular-nums;
  display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;min-height:1.45em;
}
.ops-v .age{font-size:10.5px}
.ops-item .action{width:100%;margin-top:1px}

/* anything that only matters while something is happening */
.ops-extra{display:flex;flex-direction:column;gap:10px}
.ops-extra:empty{display:none}

.pill{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  padding:4px 9px 4px 7px;border-radius:20px;
  font:600 11px/1.35 var(--ui);letter-spacing:.02em;
  border:1px solid transparent;white-space:nowrap;
}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill[data-s="pass"]{color:var(--ok);background:var(--ok-wash);border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
.pill[data-s="warn"]{color:var(--warn);background:var(--warn-wash);border-color:color-mix(in srgb,var(--warn) 26%,transparent)}
.pill[data-s="error"]{color:var(--bad);background:var(--bad-wash);border-color:color-mix(in srgb,var(--bad) 26%,transparent)}
.pill[data-s="idle"]{color:var(--idle);background:var(--idle-wash);border-color:color-mix(in srgb,var(--idle) 26%,transparent)}
.pill[data-s="busy"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.pill[data-s="busy"]::before{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}

/* the big status read on a panel: one number, one word */
.readout{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.readout b{font:600 25px/1 var(--ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.readout span{font:400 12px/1.4 var(--ui);color:var(--text-3)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;align-items:baseline}
.kv dt{font:400 11.5px/1.5 var(--ui);color:var(--text-3);white-space:nowrap}
.kv dd{
  margin:0;font:500 11.5px/1.5 var(--ui);font-variant-numeric:tabular-nums;
  text-align:right;overflow:hidden;text-overflow:ellipsis;
}

.checks{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.check{
  display:grid;grid-template-columns:14px 1fr auto;gap:9px;align-items:baseline;
  padding:7px 10px;background:var(--raised);
  font:400 11.5px/1.45 var(--ui);
}
.check i{font-style:normal;font-family:var(--ui);font-size:11px;line-height:1.45}
.check[data-s="pass"] i{color:var(--ok)}
.check[data-s="warn"] i{color:var(--warn)}
.check[data-s="error"] i{color:var(--bad)}
.check[data-s="run"] i{color:var(--accent)}
.check em{font-style:normal;color:var(--text-3);font-family:var(--ui);font-size:10.5px;
  text-align:right;white-space:nowrap}
.check b{font-weight:500}

.action{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 14px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--raised);font:500 12.5px/1 var(--ui);color:var(--text);
  transition:border-color .13s,background .13s,opacity .13s;
}
.action:hover:not([disabled]){border-color:var(--text-3)}
.action[disabled]{opacity:.42;cursor:not-allowed}
.action-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.action-primary:hover:not([disabled]){background:var(--accent-2);border-color:var(--accent-2)}
.action-wide{width:100%}

.stamp{
  border:1px solid var(--line);border-radius:var(--r);background:var(--raised);
  padding:10px 12px;
}
.stamp-k{font:600 9.5px/1 var(--ui);letter-spacing:.13em;text-transform:uppercase;color:var(--text-3)}
.stamp-rows{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.stamp-row{display:flex;align-items:baseline;gap:9px;font:500 12px/1.4 var(--ui);font-variant-numeric:tabular-nums}
.stamp-row span:first-child{
  width:26px;flex:none;font-size:10px;letter-spacing:.06em;color:var(--text-3);
}
.stamp-row .age{margin-left:auto;font-size:10.5px}
.age[data-s="ok"]{color:var(--ok)} .age[data-s="warn"]{color:var(--warn)} .age[data-s="bad"]{color:var(--bad)}

.console{
  background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 11px;max-height:168px;overflow:auto;
  font:400 11px/1.75 var(--ui);color:var(--text-2);
  white-space:pre-wrap;word-break:break-word;scrollbar-width:thin;
}
.console:empty{display:none}
.console .ok{color:var(--ok)} .console .bad{color:var(--bad)} .console .cmd{color:var(--accent)}

.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar[data-indeterminate="1"] i{width:35%;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}

.hint{font:400 11px/1.55 var(--ui);color:var(--text-3);margin:0}
.hint code{font-family:var(--ui);font-size:10.5px;color:var(--text-2);
  background:var(--raised);padding:1px 5px;border-radius:3px}

.field{display:flex;gap:7px;align-items:center}
.field input{
  flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--ink);font:400 11.5px/1.3 var(--ui);color:var(--text);
}
.field input::placeholder{color:var(--text-3)}

@media (max-width:720px){
  .plain{padding:24px 16px 48px}
  .page-title{font-size:25px}
  .nav{order:3;width:100%;overflow-x:auto;padding-bottom:2px}
}

/* upstream reachability + live retriever diagnostics on the sync panel */
.src{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.src-row{
  display:grid;grid-template-columns:9px 1fr auto;gap:9px;align-items:center;
  padding:7px 10px;background:var(--raised);font:400 11.5px/1.4 var(--ui);
}
.src-row .dot{width:7px;height:7px;border-radius:50%;background:var(--idle)}
.src-row[data-s="pass"] .dot{background:var(--ok)}
.src-row[data-s="warn"] .dot{background:var(--warn)}
.src-row[data-s="error"] .dot{background:var(--bad)}
.src-row b{font-weight:500;display:block}
.src-row small{display:block;font:400 10.5px/1.4 var(--ui);color:var(--text-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-row em{font-style:normal;font:400 10.5px/1 var(--ui);color:var(--text-3)}

.diag{display:flex;flex-direction:column;gap:7px}
.diag-card{
  border:1px solid var(--line);border-left-width:2px;border-radius:var(--r);
  background:var(--raised);padding:9px 11px;
}
.diag-card[data-s="error"]{border-left-color:var(--bad);background:var(--bad-wash)}
.diag-card[data-s="warn"]{border-left-color:var(--warn);background:var(--warn-wash)}
.diag-card[data-s="info"]{border-left-color:var(--idle)}
.diag-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.diag-top b{font:600 11.5px/1.35 var(--ui)}
.diag-count{
  margin-left:auto;font:600 10px/1 var(--ui);color:var(--text-3);
  border:1px solid var(--line-2);border-radius:9px;padding:3px 6px;white-space:nowrap;
}
.diag-detail{margin:5px 0 0;font:400 10.5px/1.5 var(--ui);color:var(--text-2);
  overflow-wrap:anywhere}
.diag-hint{margin:6px 0 0;font:400 11px/1.5 var(--ui);color:var(--text-3)}
.diag-subj{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.diag-subj span{font:500 9.5px/1 var(--ui);color:var(--text-3);
  border:1px solid var(--line);border-radius:3px;padding:3px 5px}
.stall{
  font:500 10.5px/1.5 var(--ui);color:var(--warn);
  display:flex;align-items:center;gap:6px;
}
.stall::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn);
  animation:blink 1.1s steps(2,start) infinite}

/* ======================================================================
   System page typography — Bitcount Ink.
   It is a bitmap-grid display face, so it carries the structural and
   numeric furniture (titles, pills, readouts, dates, latencies) where its
   terminal character reads as deliberate. Running prose and the streamed
   log stay in DM Sans and Plex Mono: a dot-matrix face at 10px in a
   scrolling log is decoration at the cost of legibility.
   ====================================================================== */
#page-system .page-kicker,
#page-system .page-title,
#page-system .panel-n,
#page-system .panel-title,
#page-system .pill,
#page-system .readout b,
#page-system .stamp-k,
#page-system .stamp-row,
#page-system .kv dd,
#page-system .check em,
#page-system .diag-count,
#page-system .src-row small,
#page-system .src-row em,
#page-system .bn-n,
#page-system .bn-id b,
#page-system .bn-read b,
#page-system .bn-read span,
#page-system .ops-k,
#page-system .ops-v,
#page-system .check i,
#page-system .check em,
#page-system .console,
#page-system .diag-count,
#page-system .diag-detail,
#page-system .diag-subj span,
#page-system .stall,
#page-system .hint code,
#page-system .sys-bar-meta{
  font-family:var(--sys);
}
#page-system .page-title{letter-spacing:-.005em;font-weight:700}
#page-system .page-kicker{letter-spacing:.2em}
#page-system .panel-title{letter-spacing:.005em;font-weight:500}
#page-system .pill{letter-spacing:.04em}
#page-system .readout b{letter-spacing:0;font-weight:700}
#page-system .stamp-row{letter-spacing:.02em}
/* prose and the log keep a face built for reading */
/* Controls stay in a reading face: a bitmap grid on a filled accent button
   turns to mush at button sizes, and a URL you type has to be checkable. */
#page-system .action,
#page-system .field input,
#page-system .page-lede,
#page-system .panel-title small,
#page-system .check b,
#page-system .hint,
#page-system .diag-hint,
#page-system .diag-top b,
#page-system .src-row b,
#page-system .kv dt{font-family:var(--ui)}


@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .list-pane{position:static;max-height:none}
  .list{max-height:46vh}
  .quote{text-align:left}
  .q-chg{justify-content:flex-start}
}
</style>
